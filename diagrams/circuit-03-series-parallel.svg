<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="16" y="28" font-size="15" font-weight="700" fill="#1a1a1a">Circuit 3 - Series vs Parallel</text>

  <!-- ========== Build A: Series ========== -->
  <text x="16" y="58" font-size="13" font-weight="600" fill="#1565c0">Build A: Series (chain)</text>

  <!-- horizontal chain at y=95 -->
  <text x="20" y="99" font-size="13" font-weight="700" fill="#c62828">+5V</text>
  <line x1="52" y1="95" x2="90" y2="95" stroke="#222" stroke-width="2"/>

  <!-- R1 -->
  <path d="M90 95 H105 L112 80 L126 110 L140 80 L154 110 L161 95 H175" fill="none" stroke="#222" stroke-width="2"/>
  <text x="112" y="130" font-size="12" fill="#333">220 ohm</text>

  <line x1="175" y1="95" x2="205" y2="95" stroke="#222" stroke-width="2"/>

  <!-- LED1 -->
  <polygon points="205,80 205,110 232,95" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="232" y1="80" x2="232" y2="110" stroke="#222" stroke-width="2.5"/>
  <line x1="238" y1="76" x2="250" y2="64" stroke="#222" stroke-width="1.5"/>
  <line x1="242" y1="80" x2="254" y2="68" stroke="#222" stroke-width="1.5"/>
  <text x="205" y="130" font-size="12" fill="#333">LED1</text>

  <line x1="232" y1="95" x2="270" y2="95" stroke="#222" stroke-width="2"/>

  <!-- LED2 -->
  <polygon points="270,80 270,110 297,95" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="297" y1="80" x2="297" y2="110" stroke="#222" stroke-width="2.5"/>
  <line x1="303" y1="76" x2="315" y2="64" stroke="#222" stroke-width="1.5"/>
  <line x1="307" y1="80" x2="319" y2="68" stroke="#222" stroke-width="1.5"/>
  <text x="270" y="130" font-size="12" fill="#333">LED2</text>

  <line x1="297" y1="95" x2="360" y2="95" stroke="#222" stroke-width="2"/>
  <line x1="360" y1="95" x2="360" y2="120" stroke="#222" stroke-width="2"/>
  <line x1="345" y1="120" x2="375" y2="120" stroke="#222" stroke-width="2.5"/>
  <line x1="349" y1="126" x2="371" y2="126" stroke="#222" stroke-width="2"/>
  <line x1="353" y1="132" x2="367" y2="132" stroke="#222" stroke-width="2"/>
  <text x="382" y="128" font-size="12" fill="#333">GND</text>

  <!-- ========== Build B: Parallel ========== -->
  <text x="16" y="170" font-size="13" font-weight="600" fill="#2e7d32">Build B: Parallel (fork)</text>

  <!-- +5V and left bus -->
  <text x="20" y="250" font-size="13" font-weight="700" fill="#c62828">+5V</text>
  <line x1="52" y1="246" x2="100" y2="246" stroke="#222" stroke-width="2"/>
  <line x1="100" y1="200" x2="100" y2="300" stroke="#222" stroke-width="2"/>

  <!-- Top path (Path 1) at y=200 -->
  <text x="115" y="188" font-size="11" font-weight="600" fill="#555">Path 1</text>
  <line x1="100" y1="200" x2="140" y2="200" stroke="#222" stroke-width="2"/>
  <path d="M140 200 H155 L162 185 L176 215 L190 185 L204 215 L211 200 H225" fill="none" stroke="#222" stroke-width="2"/>
  <text x="155" y="175" font-size="12" fill="#333">220 ohm</text>
  <line x1="225" y1="200" x2="255" y2="200" stroke="#222" stroke-width="2"/>
  <polygon points="255,185 255,215 282,200" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="282" y1="185" x2="282" y2="215" stroke="#222" stroke-width="2.5"/>
  <line x1="288" y1="181" x2="300" y2="169" stroke="#222" stroke-width="1.5"/>
  <line x1="292" y1="185" x2="304" y2="173" stroke="#222" stroke-width="1.5"/>
  <text x="255" y="175" font-size="12" fill="#333">LED1</text>
  <line x1="282" y1="200" x2="380" y2="200" stroke="#222" stroke-width="2"/>

  <!-- Bottom path (Path 2) at y=300 -->
  <text x="115" y="322" font-size="11" font-weight="600" fill="#555">Path 2</text>
  <line x1="100" y1="300" x2="140" y2="300" stroke="#222" stroke-width="2"/>
  <path d="M140 300 H155 L162 285 L176 315 L190 285 L204 315 L211 300 H225" fill="none" stroke="#222" stroke-width="2"/>
  <text x="155" y="340" font-size="12" fill="#333">220 ohm</text>
  <line x1="225" y1="300" x2="255" y2="300" stroke="#222" stroke-width="2"/>
  <polygon points="255,285 255,315 282,300" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="282" y1="285" x2="282" y2="315" stroke="#222" stroke-width="2.5"/>
  <line x1="288" y1="281" x2="300" y2="269" stroke="#222" stroke-width="1.5"/>
  <line x1="292" y1="285" x2="304" y2="273" stroke="#222" stroke-width="1.5"/>
  <text x="255" y="340" font-size="12" fill="#333">LED2</text>
  <line x1="282" y1="300" x2="380" y2="300" stroke="#222" stroke-width="2"/>

  <!-- Right bus to GND -->
  <line x1="380" y1="200" x2="380" y2="300" stroke="#222" stroke-width="2"/>
  <line x1="380" y1="250" x2="420" y2="250" stroke="#222" stroke-width="2"/>
  <line x1="420" y1="250" x2="420" y2="275" stroke="#222" stroke-width="2"/>
  <line x1="405" y1="275" x2="435" y2="275" stroke="#222" stroke-width="2.5"/>
  <line x1="409" y1="281" x2="431" y2="281" stroke="#222" stroke-width="2"/>
  <line x1="413" y1="287" x2="427" y2="287" stroke="#222" stroke-width="2"/>
  <text x="445" y="280" font-size="12" fill="#333">GND</text>
</svg>
