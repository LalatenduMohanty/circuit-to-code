name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint (Ruff, mypy, mdformat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch

      - name: Run lint checks
        run: hatch run lint:check

  test:
    name: Tests and PDF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Hatch
        run: pip install hatch

      - name: Run unit tests
        run: hatch run test

      - name: Build PDF (temp output; do not commit)
        run: hatch run pdf -o "${RUNNER_TEMP}/circuit-to-code-ci.pdf"

      - name: Enforce PDF commit policy
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          mapfile -t CHANGED < <(git diff --name-only "${BASE}...${HEAD}")
          pdf_changed=0
          version_changed=0
          for path in "${CHANGED[@]}"; do
            case "${path}" in
              pdf/*.pdf) pdf_changed=1 ;;
              version.py) version_changed=1 ;;
            esac
          done
          if [[ "${pdf_changed}" -eq 1 && "${version_changed}" -eq 0 ]]; then
            echo "::error::pdf/*.pdf changed without version.py. Commit release PDFs only when bumping the version."
            exit 1
          fi
