<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#fafafa"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1a1a1a">Robot brain vs motor power</text>

  <rect x="30" y="50" width="200" height="200" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="70" y="80" font-size="13" font-weight="700" fill="#0d47a1">Brain / signals</text>
  <text x="50" y="110" font-size="11" fill="#333">Classroom: Pico / Arduino</text>
  <text x="50" y="128" font-size="11" fill="#333">Team kit: Control Hub</text>
  <text x="50" y="160" font-size="11" fill="#333">Reads sensors</text>
  <text x="50" y="178" font-size="11" fill="#333">Runs your program</text>
  <text x="50" y="196" font-size="11" fill="#333">Sends small signals</text>
  <text x="50" y="220" font-size="11" font-weight="600" fill="#c62828">Not for hungry motors</text>

  <rect x="410" y="50" width="200" height="200" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="450" y="80" font-size="13" font-weight="700" fill="#f57f17">Motor power</text>
  <text x="430" y="110" font-size="11" fill="#333">Classroom: 5V rail +</text>
  <text x="430" y="128" font-size="11" fill="#333">transistor (Intermediate)</text>
  <text x="430" y="160" font-size="11" fill="#333">Team kit: hub motor ports</text>
  <text x="430" y="178" font-size="11" fill="#333">+ robot battery pack</text>
  <text x="430" y="210" font-size="11" fill="#333">Carries the heavy current</text>

  <line x1="230" y1="150" x2="300" y2="150" stroke="#222" stroke-width="2"/>
  <polygon points="300,150 290,145 290,155" fill="#222"/>
  <text x="240" y="140" font-size="10" fill="#1565c0">signal</text>

  <rect x="300" y="120" width="110" height="60" rx="6" fill="#fafafa" stroke="#222" stroke-width="2"/>
  <text x="318" y="145" font-size="11" font-weight="600" fill="#222">Driver /</text>
  <text x="318" y="162" font-size="11" font-weight="600" fill="#222">motor port</text>

  <line x1="355" y1="180" x2="355" y2="230" stroke="#222" stroke-width="2"/>
  <line x1="355" y1="230" x2="410" y2="230" stroke="#222" stroke-width="2"/>
  <polygon points="410,230 400,225 400,235" fill="#222"/>
  <text x="320" y="250" font-size="10" fill="#f57f17">power path</text>

  <text x="30" y="280" font-size="11" fill="#444">Same Intermediate rule: pin = signal; transistor or hub port feeds the motor.</text>
</svg>
