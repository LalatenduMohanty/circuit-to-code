<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="600" height="340" fill="#fafafa"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1a1a1a">Circuit 1 - Transistor Switches a Heavier Load</text>
  <line x1="40" y1="50" x2="520" y2="50" stroke="#c62828" stroke-width="2"/>
  <text x="530" y="54" font-size="13" font-weight="700" fill="#c62828">+5V</text>

  <!-- Base control path -->
  <line x1="100" y1="50" x2="100" y2="80" stroke="#222" stroke-width="2"/>
  <circle cx="100" cy="85" r="3" fill="#222"/>
  <line x1="100" y1="85" x2="125" y2="70" stroke="#222" stroke-width="2"/>
  <circle cx="130" cy="85" r="3" fill="#222"/>
  <text x="95" y="105" font-size="10" fill="#333">Button</text>
  <line x1="130" y1="85" x2="160" y2="85" stroke="#222" stroke-width="2"/>
  <path d="M160 85 H170 L175 73 L185 97 L195 73 L205 97 L210 85 H220" fill="none" stroke="#222" stroke-width="2"/>
  <text x="165" y="115" font-size="10" fill="#333">10k ohm</text>
  <line x1="220" y1="85" x2="220" y2="250" stroke="#222" stroke-width="2"/>
  <text x="130" y="170" font-size="10" fill="#1565c0">Base (small signal)</text>

  <!-- Parallel load bus from +5V -->
  <line x1="360" y1="50" x2="360" y2="70" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="70" x2="420" y2="70" stroke="#222" stroke-width="2"/>

  <!-- Branch A (left) -->
  <text x="270" y="68" font-size="10" font-weight="600" fill="#555">Branch A</text>
  <line x1="300" y1="70" x2="300" y2="90" stroke="#222" stroke-width="2"/>
  <path d="M300 90 L300 98 L288 103 L312 113 L288 123 L300 128 L300 136" fill="none" stroke="#222" stroke-width="2"/>
  <text x="220" y="118" font-size="10" fill="#333">220 ohm</text>
  <line x1="300" y1="136" x2="300" y2="155" stroke="#222" stroke-width="2"/>
  <polygon points="285,155 315,155 300,175" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="285" y1="175" x2="315" y2="175" stroke="#222" stroke-width="2.5"/>
  <text x="220" y="170" font-size="10" fill="#333">LED A</text>
  <line x1="300" y1="175" x2="300" y2="220" stroke="#222" stroke-width="2"/>

  <!-- Branch B (right) -->
  <text x="400" y="68" font-size="10" font-weight="600" fill="#555">Branch B</text>
  <line x1="420" y1="70" x2="420" y2="90" stroke="#222" stroke-width="2"/>
  <path d="M420 90 L420 98 L408 103 L432 113 L408 123 L420 128 L420 136" fill="none" stroke="#222" stroke-width="2"/>
  <text x="438" y="118" font-size="10" fill="#333">220 ohm</text>
  <line x1="420" y1="136" x2="420" y2="155" stroke="#222" stroke-width="2"/>
  <polygon points="405,155 435,155 420,175" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="405" y1="175" x2="435" y2="175" stroke="#222" stroke-width="2.5"/>
  <text x="438" y="170" font-size="10" fill="#333">LED B</text>
  <line x1="420" y1="175" x2="420" y2="220" stroke="#222" stroke-width="2"/>

  <!-- Join branches to collector -->
  <line x1="300" y1="220" x2="420" y2="220" stroke="#222" stroke-width="2"/>
  <line x1="360" y1="220" x2="360" y2="250" stroke="#222" stroke-width="2"/>
  <text x="370" y="245" font-size="10" fill="#1565c0">Collector (both branches)</text>

  <!-- Transistor -->
  <circle cx="280" cy="250" r="30" fill="#fafafa" stroke="#222" stroke-width="2"/>
  <line x1="220" y1="250" x2="250" y2="250" stroke="#222" stroke-width="2"/>
  <line x1="250" y1="235" x2="250" y2="265" stroke="#222" stroke-width="3"/>
  <line x1="250" y1="240" x2="280" y2="225" stroke="#222" stroke-width="2"/>
  <line x1="250" y1="260" x2="280" y2="275" stroke="#222" stroke-width="2"/>
  <polygon points="272,270 280,275 270,278" fill="#222"/>
  <line x1="360" y1="250" x2="310" y2="235" stroke="#222" stroke-width="2"/>
  <text x="200" y="240" font-size="11" fill="#333">Q1</text>
  <line x1="280" y1="275" x2="280" y2="300" stroke="#222" stroke-width="2"/>
  <line x1="265" y1="300" x2="295" y2="300" stroke="#222" stroke-width="2.5"/>
  <line x1="268" y1="306" x2="292" y2="306" stroke="#222" stroke-width="2"/>
  <text x="302" y="305" font-size="12" fill="#333">GND</text>

  <text x="40" y="330" font-size="11" fill="#555">Two parallel LED paths share one transistor switch — more collector current than one LED alone.</text>
</svg>
