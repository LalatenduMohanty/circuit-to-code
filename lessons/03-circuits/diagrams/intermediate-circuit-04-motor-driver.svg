<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="580" height="340" fill="#fafafa"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1a1a1a">Circuit 4 - Transistor Motor Driver + Flyback Diode</text>
  <line x1="40" y1="50" x2="500" y2="50" stroke="#c62828" stroke-width="2"/>
  <text x="510" y="54" font-size="13" font-weight="700" fill="#c62828">+5V</text>

  <line x1="90" y1="50" x2="90" y2="80" stroke="#222" stroke-width="2"/>
  <circle cx="90" cy="85" r="3" fill="#222"/>
  <line x1="90" y1="85" x2="115" y2="70" stroke="#222" stroke-width="2"/>
  <circle cx="120" cy="85" r="3" fill="#222"/>
  <text x="85" y="105" font-size="10" fill="#333">Button</text>
  <line x1="120" y1="85" x2="150" y2="85" stroke="#222" stroke-width="2"/>
  <path d="M150 85 H160 L165 73 L175 97 L185 73 L195 97 L200 85 H210" fill="none" stroke="#222" stroke-width="2"/>
  <text x="155" y="115" font-size="10" fill="#333">1k ohm</text>
  <line x1="210" y1="85" x2="210" y2="220" stroke="#222" stroke-width="2"/>
  <text x="130" y="170" font-size="10" fill="#1565c0">Base signal</text>

  <line x1="380" y1="50" x2="380" y2="90" stroke="#222" stroke-width="2"/>
  <circle cx="380" cy="120" r="28" fill="none" stroke="#222" stroke-width="2"/>
  <text x="372" y="126" font-size="16" font-weight="700" fill="#222">M</text>
  <line x1="380" y1="148" x2="380" y2="220" stroke="#222" stroke-width="2"/>
  <text x="412" y="120" font-size="11" fill="#333">Motor</text>

  <!-- flyback diode across motor -->
  <line x1="340" y1="90" x2="340" y2="148" stroke="#1565c0" stroke-width="2"/>
  <line x1="340" y1="90" x2="380" y2="90" stroke="#1565c0" stroke-width="2"/>
  <line x1="340" y1="148" x2="380" y2="148" stroke="#1565c0" stroke-width="2"/>
  <polygon points="355,105 355,133 340,119" fill="none" stroke="#1565c0" stroke-width="2"/>
  <line x1="355" y1="105" x2="355" y2="133" stroke="#1565c0" stroke-width="2.5"/>
  <text x="250" y="125" font-size="10" fill="#1565c0">Flyback diode</text>
  <text x="250" y="140" font-size="10" fill="#1565c0">(stripe toward +5V)</text>

  <circle cx="280" cy="220" r="30" fill="#fafafa" stroke="#222" stroke-width="2"/>
  <line x1="210" y1="220" x2="250" y2="220" stroke="#222" stroke-width="2"/>
  <line x1="250" y1="205" x2="250" y2="235" stroke="#222" stroke-width="3"/>
  <line x1="250" y1="210" x2="280" y2="195" stroke="#222" stroke-width="2"/>
  <line x1="250" y1="230" x2="280" y2="245" stroke="#222" stroke-width="2"/>
  <polygon points="272,240 280,245 270,248" fill="#222"/>
  <line x1="380" y1="220" x2="310" y2="205" stroke="#222" stroke-width="2"/>
  <text x="200" y="210" font-size="11" fill="#333">Q1</text>
  <line x1="280" y1="245" x2="280" y2="275" stroke="#222" stroke-width="2"/>
  <line x1="265" y1="275" x2="295" y2="275" stroke="#222" stroke-width="2.5"/>
  <line x1="268" y1="281" x2="292" y2="281" stroke="#222" stroke-width="2"/>
  <text x="302" y="280" font-size="12" fill="#333">GND</text>

  <text x="40" y="315" font-size="11" fill="#555">Power off before wiring. Motor spins one way while the button is pressed.</text>
</svg>
