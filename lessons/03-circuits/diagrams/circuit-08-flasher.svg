<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1a1a1a">Circuit 8 - Astable Multivibrator (Flasher)</text>

  <!-- +5V rail -->
  <line x1="60" y1="50" x2="560" y2="50" stroke="#c62828" stroke-width="2"/>
  <text x="570" y="54" font-size="13" font-weight="700" fill="#c62828">+5V</text>

  <!-- Left collector load: 470 + LED1 -->
  <line x1="160" y1="50" x2="160" y2="70" stroke="#222" stroke-width="2"/>
  <path d="M160 70 L160 80 L148 85 L172 95 L148 105 L172 115 L160 120 L160 130" fill="none" stroke="#222" stroke-width="2"/>
  <text x="178" y="100" font-size="10" fill="#333">470 ohm</text>
  <line x1="160" y1="130" x2="160" y2="145" stroke="#222" stroke-width="2"/>
  <polygon points="145,145 175,145 160,165" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="145" y1="165" x2="175" y2="165" stroke="#222" stroke-width="2.5"/>
  <text x="180" y="160" font-size="10" fill="#333">LED1</text>
  <line x1="160" y1="165" x2="160" y2="210" stroke="#222" stroke-width="2"/>
  <circle cx="160" cy="210" r="3" fill="#222"/>
  <text x="80" y="205" font-size="10" fill="#1565c0">C (Q1)</text>

  <!-- Right collector load: 470 + LED2 -->
  <line x1="460" y1="50" x2="460" y2="70" stroke="#222" stroke-width="2"/>
  <path d="M460 70 L460 80 L448 85 L472 95 L448 105 L472 115 L460 120 L460 130" fill="none" stroke="#222" stroke-width="2"/>
  <text x="478" y="100" font-size="10" fill="#333">470 ohm</text>
  <line x1="460" y1="130" x2="460" y2="145" stroke="#222" stroke-width="2"/>
  <polygon points="445,145 475,145 460,165" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="445" y1="165" x2="475" y2="165" stroke="#222" stroke-width="2.5"/>
  <text x="480" y="160" font-size="10" fill="#333">LED2</text>
  <line x1="460" y1="165" x2="460" y2="210" stroke="#222" stroke-width="2"/>
  <circle cx="460" cy="210" r="3" fill="#222"/>
  <text x="470" y="205" font-size="10" fill="#1565c0">C (Q2)</text>

  <!-- Base bias resistors from +5V -->
  <line x1="250" y1="50" x2="250" y2="70" stroke="#222" stroke-width="2"/>
  <path d="M250 70 L250 80 L238 85 L262 95 L238 105 L262 115 L250 120 L250 140" fill="none" stroke="#222" stroke-width="2"/>
  <text x="200" y="100" font-size="10" fill="#333">10k (Rb1)</text>
  <line x1="250" y1="140" x2="250" y2="260" stroke="#222" stroke-width="2"/>
  <circle cx="250" cy="260" r="3" fill="#222"/>
  <line x1="250" y1="260" x2="140" y2="260" stroke="#222" stroke-width="2"/>

  <line x1="370" y1="50" x2="370" y2="70" stroke="#222" stroke-width="2"/>
  <path d="M370 70 L370 80 L358 85 L382 95 L358 105 L382 115 L370 120 L370 140" fill="none" stroke="#222" stroke-width="2"/>
  <text x="378" y="100" font-size="10" fill="#333">10k (Rb2)</text>
  <line x1="370" y1="140" x2="370" y2="260" stroke="#222" stroke-width="2"/>
  <circle cx="370" cy="260" r="3" fill="#222"/>
  <line x1="370" y1="260" x2="480" y2="260" stroke="#222" stroke-width="2"/>

  <!-- Q1 -->
  <circle cx="160" cy="260" r="28" fill="#fafafa" stroke="#222" stroke-width="2"/>
  <line x1="160" y1="210" x2="160" y2="232" stroke="#222" stroke-width="2"/>
  <line x1="148" y1="248" x2="148" y2="272" stroke="#222" stroke-width="3"/>
  <line x1="148" y1="252" x2="175" y2="238" stroke="#222" stroke-width="2"/>
  <line x1="148" y1="268" x2="175" y2="282" stroke="#222" stroke-width="2"/>
  <polygon points="168,278 175,282 165,285" fill="#222"/>
  <line x1="140" y1="260" x2="148" y2="260" stroke="#222" stroke-width="2"/>
  <text x="120" y="255" font-size="10" fill="#333">B</text>
  <text x="135" y="305" font-size="11" fill="#333">Q1</text>
  <line x1="175" y1="282" x2="175" y2="340" stroke="#222" stroke-width="2"/>

  <!-- Q2 -->
  <circle cx="460" cy="260" r="28" fill="#fafafa" stroke="#222" stroke-width="2"/>
  <line x1="460" y1="210" x2="460" y2="232" stroke="#222" stroke-width="2"/>
  <line x1="448" y1="248" x2="448" y2="272" stroke="#222" stroke-width="3"/>
  <line x1="448" y1="252" x2="475" y2="238" stroke="#222" stroke-width="2"/>
  <line x1="448" y1="268" x2="475" y2="282" stroke="#222" stroke-width="2"/>
  <polygon points="468,278 475,282 465,285" fill="#222"/>
  <line x1="480" y1="260" x2="448" y2="260" stroke="#222" stroke-width="2"/>
  <text x="485" y="255" font-size="10" fill="#333">B</text>
  <text x="435" y="305" font-size="11" fill="#333">Q2</text>
  <line x1="475" y1="282" x2="475" y2="340" stroke="#222" stroke-width="2"/>

  <!-- C1: Q1 collector -> Q2 base (direct) -->
  <line x1="160" y1="210" x2="280" y2="210" stroke="#222" stroke-width="2"/>
  <text x="270" y="200" font-size="10" fill="#c62828">+</text>
  <line x1="280" y1="195" x2="280" y2="225" stroke="#222" stroke-width="3"/>
  <path d="M292 195 A12 18 0 0 1 292 225" fill="none" stroke="#222" stroke-width="2.5"/>
  <text x="300" y="205" font-size="10" fill="#333">C1 10uF</text>
  <line x1="292" y1="210" x2="370" y2="210" stroke="#222" stroke-width="2"/>
  <line x1="370" y1="210" x2="370" y2="260" stroke="#222" stroke-width="2"/>

  <!-- C2: Q2 collector -> Q1 base (direct) -->
  <line x1="460" y1="210" x2="340" y2="180" stroke="#222" stroke-width="2"/>
  <line x1="340" y1="180" x2="300" y2="180" stroke="#222" stroke-width="2"/>
  <text x="310" y="172" font-size="10" fill="#c62828">+</text>
  <line x1="300" y1="165" x2="300" y2="195" stroke="#222" stroke-width="3"/>
  <path d="M288 165 A12 18 0 0 0 288 195" fill="none" stroke="#222" stroke-width="2.5"/>
  <text x="220" y="175" font-size="10" fill="#333">C2 10uF</text>
  <line x1="288" y1="180" x2="250" y2="180" stroke="#222" stroke-width="2"/>
  <line x1="250" y1="180" x2="250" y2="260" stroke="#222" stroke-width="2"/>

  <!-- GND -->
  <line x1="175" y1="340" x2="475" y2="340" stroke="#222" stroke-width="2"/>
  <line x1="325" y1="340" x2="325" y2="355" stroke="#222" stroke-width="2"/>
  <line x1="310" y1="355" x2="340" y2="355" stroke="#222" stroke-width="2.5"/>
  <line x1="314" y1="361" x2="336" y2="361" stroke="#222" stroke-width="2"/>
  <line x1="318" y1="367" x2="332" y2="367" stroke="#222" stroke-width="2"/>
  <text x="348" y="362" font-size="12" fill="#333">GND</text>

  <text x="16" y="392" font-size="11" fill="#555">Base resistors go to +5V. Caps couple each collector to the opposite base (no resistor in that path).</text>
</svg>
